name: Docs

# Builds the docs app and deploys it to GitHub Pages (https://<owner>.github.io/momentra/).
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Build docs app
        run: npm run docs:build -- --base-href "/${{ github.event.repository.name }}/"

      # Pages has no SPA fallback: serve index.html for deep links like /momentra/date-picker.
      - run: cp dist/docs/browser/index.html dist/docs/browser/404.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/docs/browser

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
