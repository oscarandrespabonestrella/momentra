<chr-field
  [theme]="effectiveTheme()"
  [invalid]="invalid()"
  [disabled]="isDisabled()"
  [readonly]="readonly()"
  [showClear]="clearVisible()"
  [clearLabel]="labels().clear"
  [inputId]="fieldId()"
  toggleIcon="clock"
  [toggleLabel]="labels().openTimePicker"
  [expanded]="open()"
  [popupId]="popupId"
  (clear)="clear()"
  (toggle)="togglePopup()"
>
  <input
    #field
    class="chr-input"
    type="text"
    role="combobox"
    autocomplete="off"
    aria-haspopup="dialog"
    aria-autocomplete="none"
    [id]="fieldId()"
    [value]="text()"
    [placeholder]="placeholderText()"
    [disabled]="isDisabled()"
    [readOnly]="readonly()"
    [required]="required()"
    [attr.aria-expanded]="open()"
    [attr.aria-controls]="open() ? popupId : null"
    [attr.aria-label]="ariaLabel()"
    [attr.aria-labelledby]="ariaLabelledby()"
    [attr.aria-invalid]="invalid() ? 'true' : null"
    [attr.aria-describedby]="errorMessageList().length ? errorsId : null"
    (input)="onInput(field.value)"
    (keydown)="onKeydown($event)"
    (blur)="onBlur()"
  />
</chr-field>
@if (errorMessageList().length) {
  <div class="chr-errors" role="alert" [id]="errorsId">
    @for (message of errorMessageList(); track $index) {
      <p>{{ message }}</p>
    }
  </div>
}

<ng-template
  cdkConnectedOverlay
  [cdkConnectedOverlayOrigin]="shell().element"
  [cdkConnectedOverlayOpen]="open()"
  [cdkConnectedOverlayPositions]="positions"
  [cdkConnectedOverlayPush]="true"
  [cdkConnectedOverlayViewportMargin]="8"
  (overlayOutsideClick)="onOutsideClick($event)"
  (overlayKeydown)="onOverlayKeydown($event)"
  (attach)="onAttach()"
  (detach)="onDetach()"
>
  <div
    class="chr-popup"
    role="dialog"
    aria-modal="true"
    cdkTrapFocus
    [id]="popupId"
    [attr.aria-label]="labels().timeSelector"
    [attr.data-chr-theme]="effectiveTheme()"
  >
    <chr-time-selector
      [value]="value()"
      [baseDate]="selectorBase()"
      [locale]="effectiveLocale()"
      [use12Hours]="use12Hours()"
      [showSeconds]="secondsVisible()"
      [hourStep]="hourStep()"
      [minuteStep]="minuteStep()"
      [secondStep]="secondStep()"
      [min]="min()"
      [max]="max()"
      [readonly]="readonly()"
      [theme]="effectiveTheme()"
      (valueChange)="onSelectorChange($event)"
    />
    <div class="chr-popup-footer">
      <button type="button" class="chr-btn chr-btn-ghost" (click)="selectNow()">{{ labels().now }}</button>
      <button type="button" class="chr-btn chr-btn-primary" (click)="done()">{{ labels().done }}</button>
    </div>
  </div>
</ng-template>
