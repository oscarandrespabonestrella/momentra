<chr-field
  [theme]="effectiveTheme()"
  [invalid]="invalid()"
  [disabled]="isDisabled()"
  [readonly]="readonly()"
  [showClear]="clearVisible()"
  [clearLabel]="labels().clear"
  [inputId]="startId()"
  toggleIcon="calendar"
  [toggleLabel]="open() ? labels().closeCalendar : labels().openCalendar"
  [expanded]="open()"
  [popupId]="popupId"
  (clear)="clear()"
  (toggle)="togglePopup()"
>
  <div
    class="chr-range-inputs"
    role="group"
    [attr.aria-label]="ariaLabelledby() ? null : ariaLabel() || labels().dateRange"
    [attr.aria-labelledby]="ariaLabelledby()"
  >
    <input
      #startField
      class="chr-input"
      type="text"
      role="combobox"
      autocomplete="off"
      aria-haspopup="dialog"
      aria-autocomplete="none"
      [id]="startId()"
      [value]="startText()"
      [placeholder]="placeholderText()"
      [disabled]="isDisabled()"
      [readOnly]="readonly()"
      [attr.aria-label]="labels().startDate"
      [attr.aria-expanded]="open()"
      [attr.aria-controls]="open() ? popupId : null"
      [attr.aria-invalid]="invalid() ? 'true' : null"
      [attr.aria-required]="required() ? 'true' : null"
      [attr.aria-describedby]="errorMessageList().length ? errorsId : null"
      (input)="onTextInput('start', startField.value)"
      (keydown)="onInputKeydown($event)"
      (blur)="onInputBlur()"
    />
    <span class="chr-separator" aria-hidden="true">–</span>
    <input
      #endField
      class="chr-input"
      type="text"
      role="combobox"
      autocomplete="off"
      aria-haspopup="dialog"
      aria-autocomplete="none"
      [id]="endId"
      [value]="endText()"
      [placeholder]="placeholderText()"
      [disabled]="isDisabled()"
      [readOnly]="readonly()"
      [attr.aria-label]="labels().endDate"
      [attr.aria-expanded]="open()"
      [attr.aria-controls]="open() ? popupId : null"
      [attr.aria-invalid]="invalid() ? 'true' : null"
      [attr.aria-required]="required() ? 'true' : null"
      [attr.aria-describedby]="errorMessageList().length ? errorsId : null"
      (input)="onTextInput('end', endField.value)"
      (keydown)="onInputKeydown($event)"
      (blur)="onInputBlur()"
    />
  </div>
</chr-field>
@if (errorMessageList().length) {
  <div class="chr-errors" role="alert" [id]="errorsId">
    @for (message of errorMessageList(); track $index) {
      <p>{{ message }}</p>
    }
  </div>
}

<ng-template
  cdkConnectedOverlay
  [cdkConnectedOverlayOrigin]="shell().element"
  [cdkConnectedOverlayOpen]="open()"
  [cdkConnectedOverlayPositions]="positions"
  [cdkConnectedOverlayPush]="true"
  [cdkConnectedOverlayViewportMargin]="8"
  (overlayOutsideClick)="onOutsideClick($event)"
  (overlayKeydown)="onOverlayKeydown($event)"
  (attach)="onAttach()"
  (detach)="onDetach()"
>
  <div
    class="chr-popup"
    role="dialog"
    aria-modal="true"
    cdkTrapFocus
    [id]="popupId"
    [attr.aria-label]="labels().dateRange"
    [attr.data-chr-theme]="effectiveTheme()"
  >
    <div class="chr-popup-body">
      @if (presetList().length) {
        <div class="chr-presets" role="group" [attr.aria-label]="labels().presets">
          <span class="chr-presets-head" aria-hidden="true">{{ labels().presets }}</span>
          @for (item of presetList(); track item.label) {
            <button
              type="button"
              class="chr-preset"
              [class.chr-active]="item.active"
              [attr.aria-pressed]="item.active"
              [disabled]="item.disabled || !isInteractive()"
              (click)="applyPreset(item.preset)"
            >
              {{ item.label }}
            </button>
          }
        </div>
      }
      <div class="chr-popup-main">
        <div class="chr-months">
          <chr-calendar
            class="chr-hide-outside chr-hide-next"
            [initialDate]="leftMonth()"
            [range]="highlight()"
            [min]="min()"
            [max]="max()"
            [disabledDates]="calendarDisabled()"
            [locale]="effectiveLocale()"
            [theme]="effectiveTheme()"
            [cellTemplate]="cellTemplate()"
            [showToday]="showToday()"
            [readonly]="readonly()"
            (dateSelect)="onCalendarSelect($event)"
            (dateHover)="onHover($event)"
            (activeDateChange)="onMonthChange($event, 0)"
          />
          <chr-calendar
            class="chr-cal-second chr-hide-outside chr-hide-prev"
            [initialDate]="rightMonth()"
            [range]="highlight()"
            [min]="min()"
            [max]="max()"
            [disabledDates]="calendarDisabled()"
            [locale]="effectiveLocale()"
            [theme]="effectiveTheme()"
            [cellTemplate]="cellTemplate()"
            [showToday]="false"
            [readonly]="readonly()"
            (dateSelect)="onCalendarSelect($event)"
            (dateHover)="onHover($event)"
            (activeDateChange)="onMonthChange($event, 1)"
          />
        </div>
        <div class="chr-range-footer">
          <p class="chr-hint" aria-live="polite">{{ hint() || summary() }}</p>
        </div>
      </div>
    </div>
  </div>
</ng-template>
