@let vm = viewModel();
<div
  class="chr-cal"
  role="group"
  [attr.aria-label]="ariaLabelledby() ? null : ariaLabel() || labels().calendar"
  [attr.aria-labelledby]="ariaLabelledby()"
>
  <div class="chr-cal-header">
    <button
      type="button"
      class="chr-nav"
      [attr.aria-label]="prevLabel()"
      [disabled]="isDisabled() || prevDisabled()"
      (click)="shift(-1)"
    >
      <svg viewBox="0 0 16 16" aria-hidden="true" focusable="false"><path d="M10 3 5 8l5 5" /></svg>
    </button>
    <button
      type="button"
      class="chr-title"
      aria-live="polite"
      [attr.aria-label]="canDrillUp() ? labels().chooseView + ': ' + vm.title : vm.title"
      [disabled]="isDisabled() || !canDrillUp()"
      (click)="drillUp()"
    >
      {{ vm.title }}
    </button>
    <button
      type="button"
      class="chr-nav"
      [attr.aria-label]="nextLabel()"
      [disabled]="isDisabled() || nextDisabled()"
      (click)="shift(1)"
    >
      <svg viewBox="0 0 16 16" aria-hidden="true" focusable="false"><path d="m6 3 5 5-5 5" /></svg>
    </button>
  </div>

  <table
    class="chr-grid"
    [class.chr-grid-day]="vm.view === 'day'"
    role="grid"
    [attr.aria-label]="vm.title"
    [attr.aria-readonly]="readonly() ? 'true' : null"
    (keydown)="onGridKeydown($event)"
    (mouseleave)="onGridLeave()"
  >
    @if (vm.view === 'day') {
      <thead>
        <tr>
          @for (weekday of vm.weekdays; track weekday.long) {
            <th scope="col" class="chr-weekday" [attr.abbr]="weekday.long" [attr.aria-label]="weekday.long">
              {{ weekday.short }}
            </th>
          }
        </tr>
      </thead>
    }
    <tbody>
      @for (row of vm.rows; track $index) {
        <tr>
          @for (cell of row; track cell.key) {
            <td role="gridcell" [attr.aria-selected]="cell.selected" [attr.aria-disabled]="cellAriaDisabled(cell)">
              <button
                type="button"
                class="chr-cell"
                [class.chr-selected]="cell.selected"
                [class.chr-today]="cell.today"
                [class.chr-outside]="cell.outside"
                [class.chr-disabled]="cell.disabled"
                [class.chr-in-range]="cell.inRange"
                [class.chr-range-start]="cell.rangeStart"
                [class.chr-range-end]="cell.rangeEnd"
                [attr.tabindex]="cell.active ? 0 : -1"
                [attr.cdkFocusInitial]="cell.active ? '' : null"
                [attr.aria-label]="cell.ariaLabel"
                [attr.aria-current]="cell.today ? 'date' : null"
                [attr.aria-disabled]="cellAriaDisabled(cell)"
                (click)="pick(cell)"
                (mouseenter)="onCellEnter(cell)"
                (focus)="onCellFocus(cell)"
              >
                @if (cellTemplate(); as tpl) {
                  <ng-container [ngTemplateOutlet]="tpl" [ngTemplateOutletContext]="cellContext(cell)" />
                } @else {
                  {{ cell.label }}
                }
              </button>
            </td>
          }
        </tr>
      }
    </tbody>
  </table>

  @if (showTodayButton()) {
    <div class="chr-cal-footer">
      <button type="button" class="chr-today-btn" [disabled]="todayDisabled()" (click)="selectToday()">
        {{ todayLabel() }}
      </button>
    </div>
  }
</div>
