<mtr-field
  [theme]="effectiveTheme()"
  [invalid]="invalid()"
  [disabled]="isDisabled()"
  [readonly]="readonly()"
  [showClear]="clearVisible()"
  [clearLabel]="labels().clear"
  [inputId]="fieldId()"
  toggleIcon="calendar"
  [toggleLabel]="open() ? labels().closeCalendar : labels().openCalendar"
  [expanded]="open()"
  [popupId]="popupId"
  (clear)="clear()"
  (toggle)="togglePopup()"
>
  <input
    #field
    class="mtr-input"
    type="text"
    role="combobox"
    autocomplete="off"
    aria-haspopup="dialog"
    aria-autocomplete="none"
    [id]="fieldId()"
    [value]="text()"
    [placeholder]="placeholderText()"
    [disabled]="isDisabled()"
    [readOnly]="readonly()"
    [required]="required()"
    [attr.aria-expanded]="open()"
    [attr.aria-controls]="open() ? popupId : null"
    [attr.aria-label]="ariaLabel()"
    [attr.aria-labelledby]="ariaLabelledby()"
    [attr.aria-invalid]="invalid() ? 'true' : null"
    [attr.aria-describedby]="errorMessageList().length ? errorsId : null"
    (input)="onInput(field.value)"
    (keydown)="onKeydown($event)"
    (blur)="onBlur()"
  />
</mtr-field>
@if (errorMessageList().length) {
  <div class="mtr-errors" role="alert" [id]="errorsId">
    @for (message of errorMessageList(); track $index) {
      <p>{{ message }}</p>
    }
  </div>
}

<ng-template
  cdkConnectedOverlay
  [cdkConnectedOverlayOrigin]="shell().element"
  [cdkConnectedOverlayOpen]="open()"
  [cdkConnectedOverlayPositions]="positions"
  [cdkConnectedOverlayPush]="true"
  [cdkConnectedOverlayViewportMargin]="8"
  (overlayOutsideClick)="onOutsideClick($event)"
  (overlayKeydown)="onOverlayKeydown($event)"
  (attach)="onAttach()"
  (detach)="onDetach()"
>
  <div
    class="mtr-popup"
    role="dialog"
    aria-modal="true"
    cdkTrapFocus
    [id]="popupId"
    [attr.aria-label]="labels().calendar"
    [attr.data-mtr-theme]="effectiveTheme()"
  >
    @if (layout() === 'tabs') {
      <div class="mtr-popup-tabs" role="tablist" [attr.aria-label]="labels().dateAndTime">
        <button type="button" role="tab" class="mtr-tab" id="{{ popupId }}-tab-date" [attr.aria-selected]="tab() === 'date'" [attr.aria-controls]="popupId + '-panel'" [attr.tabindex]="tab() === 'date' ? 0 : -1" (click)="tab.set('date')">
          {{ labels().date }}
        </button>
        <button type="button" role="tab" class="mtr-tab" id="{{ popupId }}-tab-time" [attr.aria-selected]="tab() === 'time'" [attr.aria-controls]="popupId + '-panel'" [attr.tabindex]="tab() === 'time' ? 0 : -1" (click)="tab.set('time')">
          {{ labels().time }}
        </button>
      </div>
      <div class="mtr-popup-body mtr-popup-body-tabs" role="tabpanel" [id]="popupId + '-panel'" [attr.aria-labelledby]="popupId + '-tab-' + tab()">
        @if (tab() === 'date') {
          <mtr-infinite-calendar
            [monthRail]="false"
            [value]="value()"
            [initialDate]="calendarStart()"
            [min]="min()"
            [max]="max()"
            [disabledDates]="disabledDates()"
            [locale]="effectiveLocale()"
            [theme]="effectiveTheme()"
            [cellTemplate]="cellTemplate()"
            [showToday]="showToday()"
            [readonly]="readonly()"
            (dateSelect)="onCalendarSelect($event)"
          />
        } @else {
          <mtr-time-selector
          class="mtr-popup-time-tab"
          [value]="value()"
          [baseDate]="value() ?? calendarStart()"
          [locale]="effectiveLocale()"
          [use12Hours]="use12Hours()"
          [showSeconds]="secondsVisible()"
          [hourStep]="hourStep()"
          [minuteStep]="minuteStep()"
          [secondStep]="secondStep()"
          [min]="timeMin()"
          [max]="timeMax()"
          [readonly]="readonly()"
          [theme]="effectiveTheme()"
          (valueChange)="onTimeChange($event)"
      />
        }
      </div>
      <div class="mtr-popup-footer">
        <button type="button" class="mtr-btn" (click)="cancel()">{{ labels().cancel }}</button>
        <button type="button" class="mtr-btn mtr-btn-primary" [disabled]="!canSet()" (click)="done()">{{ labels().set }}</button>
      </div>
    } @else {
    <div class="mtr-popup-body">
      <mtr-calendar
        [value]="value()"
        [initialDate]="calendarStart()"
        [min]="min()"
        [max]="max()"
        [disabledDates]="disabledDates()"
        [locale]="effectiveLocale()"
        [theme]="effectiveTheme()"
        [cellTemplate]="cellTemplate()"
        [showToday]="showToday()"
        [readonly]="readonly()"
        (dateSelect)="onCalendarSelect($event)"
      />
      <mtr-time-selector
        class="mtr-popup-time"
        [value]="value()"
        [baseDate]="value() ?? calendarStart()"
        [locale]="effectiveLocale()"
        [use12Hours]="use12Hours()"
        [showSeconds]="secondsVisible()"
        [hourStep]="hourStep()"
        [minuteStep]="minuteStep()"
        [secondStep]="secondStep()"
        [min]="timeMin()"
        [max]="timeMax()"
        [readonly]="readonly()"
        [theme]="effectiveTheme()"
        (valueChange)="onTimeChange($event)"
      />
    </div>
    <div class="mtr-popup-footer">
      <button type="button" class="mtr-btn mtr-btn-ghost" (click)="selectNow()">{{ labels().now }}</button>
      <button type="button" class="mtr-btn mtr-btn-primary" (click)="done()">{{ labels().done }}</button>
    </div>
    }
  </div>
</ng-template>
